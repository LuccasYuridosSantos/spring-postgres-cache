spring:
  application:
    name: pg-cache-example
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pgcache}
    username: ${DB_USER:pgcache}
    password: ${DB_PASSWORD:pgcache}

pg-cache:
  default-ttl: ${PG_CACHE_DEFAULT_TTL:30s}
  cleanup-interval: ${PG_CACHE_CLEANUP_INTERVAL:20s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        pgcache.example.lookup: true
        http.server.requests: true

logging:
  level:
    com.project: DEBUG
